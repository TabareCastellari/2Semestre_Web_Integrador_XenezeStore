<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos - Xeneize Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Cabeçalho do site -->
    <header class="topo">
        <h1 class="topo_nome">Xeneize Store</h1>
        <p class="topo_apoio">La mitad más uno, agora também na internet.</p>
        <!-- menu navegável -->
        <nav>
            <ul class="menu">
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo principal -->
    <main>
        <section class="secao">
            <h2>Cadastro de Produtos</h2>
            <p>Utilize o formulário abaixo para cadastrar novos produtos da Xeneize Store.</p>
            <!-- Formulário -->
            <form class="formulario" id="formCadastro">
                <div class="campo">
                    <label for="nomeProduto">
                        Nome do Produto
                    </label>
                    <input
                        type="text"
                        id="nomeProduto"
                        name="nomeProduto"
                        required
                        placeholder="Ex.: Camisa Boca Juniors 2027">
                </div>

                <div class="campo">
                    <label for="preco">
                        Preço
                    </label>

                    <input
                        type="number"
                        id="preco"
                        name="preco"
                        required
                        min="1"
                        step="0.01"
                        placeholder="Ex.: 399.90">
                </div>

                <div class="campo">
                    <label for="descricao">
                        Descrição
                    </label>

                    <textarea
                        id="descricao"
                        name="descricao"
                        required
                        placeholder="Descreva o produto">
                    </textarea>
                </div>

                <button type="submit" class="botao">
                    Cadastrar Produto
                </button>

            </form>

        </section>

    </main>

    <!-- Rodapé -->
    <footer class="rodape">

        <p>
            Xeneize Store &middot; Projeto Integrador
        </p>

    </footer>

    <script src="js/scriptCadastro.js"></script>

</body>

</html>
